services:
  - type: web
    name: biens-artesania
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: biens-artesania-db
          property: connectionString

databases:
  - name: biens-artesania-db
    databaseName: biens_artesania
    user: admin
    plan: free
    region: oregon
