<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bien's Artesania</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
            color: #1a1a1a;
        }
        .admin-header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .admin-header h1 {
            font-size: 24px;
            color: #ed2c91;
        }
        .admin-header .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-card i {
            font-size: 32px;
            color: #667eea;
        }
        .stat-card h3 {
            margin: 10px 0;
            font-size: 28px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #555;
        }
        .tab-btn.active {
            color: #ed2c91;
            border-bottom: 2px solid #ed2c91;
        }
        .tab-content {
            display: none;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f9f9f9;
            font-weight: 600;
        }
        .status-select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .update-status {
            background: #28a745;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .view-items {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-completed { background: #d4edda; color: #155724; }
        .badge-cancelled { background: #f8d7da; color: #721c24; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            th, td { font-size: 12px; padding: 8px; }
            .tab-btn { padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1><i class="fas fa-crown"></i> Bien's Artesania Admin</h1>
        <button class="logout-btn" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="container">
        <div class="stats-cards" id="statsCards">
            <div class="stat-card"><i class="fas fa-shopping-cart"></i><h3 id="totalOrders">0</h3><p>Total Orders</p></div>
            <div class="stat-card"><i class="fas fa-users"></i><h3 id="totalUsers">0</h3><p>Registered Users</p></div>
            <div class="stat-card"><i class="fas fa-hourglass-half"></i><h3 id="pendingOrders">0</h3><p>Pending Orders</p></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('orders')">📦 All Orders</button>
            <button class="tab-btn" onclick="showTab('users')">👥 Registered Users</button>
            <button class="tab-btn" onclick="showTab('products')">🛍️ Products Management</button>
        </div>

        <div id="ordersTab" class="tab-content active">
            <h3><i class="fas fa-list"></i> All Customer Orders</h3>
            <div id="ordersTableContainer">Loading orders...</div>
        </div>

        <div id="usersTab" class="tab-content">
            <h3><i class="fas fa-users"></i> Registered Users</h3>
            <div id="usersTableContainer">Loading users...</div>
        </div>

        <div id="productsTab" class="tab-content">
            <h3><i class="fas fa-box"></i> Products Management</h3>
            <button style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-bottom: 20px;" onclick="openAddProductModal()">+ Add New Product</button>
            <div id="productsTableContainer">Loading products...</div>
        </div>
    </div>

    <!-- Modal for order items -->
    <div id="itemsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeItemsModal()">&times;</span>
            <h3>Order Items</h3>
            <div id="modalItemsList"></div>
        </div>
    </div>

    <!-- Modal for adding/editing products -->
    <div id="productModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="modal-close" onclick="closeProductModal()">&times;</span>
            <h3 id="productModalTitle">Add New Product</h3>
            <form id="productForm" onsubmit="submitProductForm(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Product Name:</label>
                    <input type="text" id="productName" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Price (₱):</label>
                    <input type="number" id="productPrice" required step="0.01" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Image URL:</label>
                    <input type="text" id="productImage" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;">
                    <small style="color: #666;">Paste the full image URL (e.g., https://example.com/image.jpg)</small>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="submitBtn" style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; flex: 1;">Add Product</button>
                    <button type="button" onclick="closeProductModal()" style="background: #ccc; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api';
        const ADMIN_TOKEN = 'admin_special_token_2025';  // Must match server.js
        let allOrders = [];
        let allUsers = [];
        let allProducts = [];
        let editingProductId = null;

        // Check if admin is logged in (session from auth.html)
        function checkAdminAuth() {
            const isAdminLoggedIn = localStorage.getItem('adminLoggedIn');
            if (isAdminLoggedIn !== 'true') {
                window.location.href = '/auth.html';
            }
        }

        // Helper for fetch with admin token
        async function adminFetch(url, options = {}) {
            const headers = {
                'admin-token': ADMIN_TOKEN,
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        }

        async function loadStats() {
            try {
                const ordersRes = await adminFetch(`${API_URL}/admin/orders`);
                const orders = await ordersRes.json();
                const usersRes = await adminFetch(`${API_URL}/admin/users`);
                const users = await usersRes.json();
                document.getElementById('totalOrders').textContent = orders.length;
                document.getElementById('totalUsers').textContent = users.length;
                const pendingCount = orders.filter(o => o.status === 'pending').length;
                document.getElementById('pendingOrders').textContent = pendingCount;
            } catch(e) {
                console.error('Stats error:', e);
            }
        }

        async function loadAllOrders() {
            try {
                const res = await adminFetch(`${API_URL}/admin/orders`);
                if (!res.ok) throw new Error('Failed to fetch orders');
                allOrders = await res.json();
                renderOrdersTable();
            } catch(e) {
                document.getElementById('ordersTableContainer').innerHTML = '<p>Error loading orders</p>';
            }
        }

        function renderOrdersTable() {
            const container = document.getElementById('ordersTableContainer');
            if (!allOrders.length) {
                container.innerHTML = '<p>No orders found.</p>';
                return;
            }
            let html = `<table><thead><tr><th>Order ID</th><th>Customer</th><th>Email</th><th>Payment</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>`;
            allOrders.forEach(order => {
                const date = new Date(order.created_at).toLocaleString();
                const statusClass = `badge-${order.status}`;
                html += `
                    <tr>
                        <td>#${order.id}</td>
                        <td>${order.customer_name}</td>
                        <td>${order.customer_email || '-'}</td>
                        <td>${order.payment_method}</td>
                        <td>₱${order.total}</td>
                        <td>
                            <span class="badge ${statusClass}">${order.status}</span>
                            <select id="status-${order.id}" class="status-select">
                                <option value="pending" ${order.status==='pending'?'selected':''}>Pending</option>
                                <option value="completed" ${order.status==='completed'?'selected':''}>Completed</option>
                                <option value="cancelled" ${order.status==='cancelled'?'selected':''}>Cancelled</option>
                            </select>
                            <button class="update-status" onclick="updateOrderStatus(${order.id})">Update</button>
                        </td>
                        <td>${date}</td>
                        <td><button class="view-items" onclick="viewOrderItems(${order.id})">View Items</button></td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        window.updateOrderStatus = async function(orderId) {
            const select = document.getElementById(`status-${orderId}`);
            const newStatus = select.value;
            try {
                const res = await adminFetch(`${API_URL}/admin/orders/${orderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    alert('Status updated successfully');
                    loadAllOrders();
                    loadStats();
                } else {
                    alert('Update failed');
                }
            } catch(e) { alert('Error updating status'); }
        };

        window.viewOrderItems = async function(orderId) {
            try {
                // Note: This endpoint does not require admin token (it's the public order detail)
                const res = await fetch(`${API_URL}/orders/${orderId}`);
                if (!res.ok) throw new Error();
                const order = await res.json();
                let itemsHtml = '<ul>';
                order.items.forEach(item => {
                    itemsHtml += `<li>${item.product_name} x ${item.quantity} = ₱${item.price * item.quantity}</li>`;
                });
                itemsHtml += '</ul>';
                document.getElementById('modalItemsList').innerHTML = itemsHtml;
                document.getElementById('itemsModal').classList.add('open');
            } catch(e) {
                alert('Could not load order items');
            }
        };

        function closeItemsModal() {
            document.getElementById('itemsModal').classList.remove('open');
        }

        async function loadAllUsers() {
            try {
                const res = await adminFetch(`${API_URL}/admin/users`);
                if (!res.ok) throw new Error();
                allUsers = await res.json();
                renderUsersTable();
            } catch(e) {
                document.getElementById('usersTableContainer').innerHTML = '<p>Error loading users</p>';
            }
        }

        function renderUsersTable() {
            const container = document.getElementById('usersTableContainer');
            if (!allUsers.length) {
                container.innerHTML = '<p>No registered users yet.</p>';
                return;
            }
            let html = `<table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Registered On</th></tr></thead><tbody>`;
            allUsers.forEach(user => {
                const date = new Date(user.created_at).toLocaleString();
                html += `<tr><td>${user.id}</td><td>${user.username}</td><td>${user.email}</td><td>${date}</td></tr>`;
            });
            html += '</tbody></tr>';
            container.innerHTML = html;
        }

        // ===== PRODUCTS MANAGEMENT =====
        async function loadAllProducts() {
            try {
                const res = await adminFetch(`${API_URL}/admin/products`);
                if (!res.ok) throw new Error('Failed to fetch products');
                allProducts = await res.json();
                renderProductsTable();
            } catch(e) {
                document.getElementById('productsTableContainer').innerHTML = '<p>Error loading products</p>';
            }
        }

        function renderProductsTable() {
            const container = document.getElementById('productsTableContainer');
            if (!allProducts.length) {
                container.innerHTML = '<p>No products found.</p>';
                return;
            }
            let html = `<table style="width: 100%; border-collapse: collapse; overflow-x: auto;"><thead><tr style="background: #f9f9f9; font-weight: 600;"><th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">Image</th><th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">Name</th><th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">Price</th><th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">Actions</th></tr></thead><tbody>`;
            allProducts.forEach(product => {
                html += `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 12px;"><img src="${product.image}" alt="${product.name}" style="width: 50px; height: 50px; border-radius: 4px; object-fit: cover;"></td>
                        <td style="padding: 12px;">${product.name}</td>
                        <td style="padding: 12px;">₱${product.price}</td>
                        <td style="padding: 12px;">
                            <button onclick="editProduct(${product.id})" style="background: #667eea; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px;">Edit</button>
                            <button onclick="deleteProduct(${product.id})" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Delete</button>
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function openAddProductModal() {
            editingProductId = null;
            document.getElementById('productModalTitle').textContent = 'Add New Product';
            document.getElementById('submitBtn').textContent = 'Add Product';
            document.getElementById('productForm').reset();
            document.getElementById('productModal').classList.add('open');
        }

        function editProduct(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            editingProductId = productId;
            document.getElementById('productModalTitle').textContent = 'Edit Product';
            document.getElementById('submitBtn').textContent = 'Update Product';
            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productImage').value = product.image;
            document.getElementById('productModal').classList.add('open');
        }

        async function submitProductForm(event) {
            event.preventDefault();
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').value;

            try {
                const url = editingProductId ? `${API_URL}/admin/products/${editingProductId}` : `${API_URL}/admin/products`;
                const method = editingProductId ? 'PUT' : 'POST';

                const res = await adminFetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, price: parseFloat(price), image })
                });

                if (res.ok) {
                    alert(editingProductId ? 'Product updated successfully' : 'Product added successfully');
                    closeProductModal();
                    loadAllProducts();
                } else {
                    const errorData = await res.json();
                    alert('Failed to save product: ' + (errorData.error || 'Unknown error'));
                    console.error('Save product error:', errorData);
                }
            } catch(e) {
                alert('Error saving product: ' + e.message);
            }
        }

        window.deleteProduct = async function(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                const res = await adminFetch(`${API_URL}/admin/products/${productId}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Product deleted successfully');
                    loadAllProducts();
                } else {
                    alert('Failed to delete product');
                }
            } catch(e) {
                alert('Error deleting product: ' + e.message);
            }
        };

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('open');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'orders') {
                document.getElementById('ordersTab').classList.add('active');
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            } else if (tab === 'users') {
                document.getElementById('usersTab').classList.add('active');
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                loadAllUsers();
            } else if (tab === 'products') {
                document.getElementById('productsTab').classList.add('active');
                document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
                loadAllProducts();
            }
        }

        function adminLogout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminUsername');
            window.location.href = '/auth.html';
        }

        // Initialize
        checkAdminAuth();
        loadStats();
        loadAllOrders();
    </script>
</body>
</html>
